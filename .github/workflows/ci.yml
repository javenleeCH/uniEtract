name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets
      - name: Agent contract tests
        run: cargo test --test agent
      - name: Distribution metadata
        run: python -c "from pathlib import Path; assert Path('LICENSE').is_file(), 'LICENSE is missing'"
      - name: Release build
        run: cargo build --release
      - name: Sample smoke
        run: python sample/smoke.py
      - name: Sample cases checklist is up to date
        run: python sample/export_cases.py --check
