name: CI

on:
  push:
  pull_request:

jobs:
  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: MSRV build with frozen dependencies
        run: cargo build --locked
      - name: MSRV tests with frozen dependencies
        run: cargo test --all-targets --locked
      - name: Fuzz manifest resolves under --locked
        run: python .github/scripts/check_fuzz_manifest.py

  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Pin the toolchain: `-D warnings` on a moving `stable` would fail on
      # unrelated new lints. Rust 1.88 is both the MSRV and the CI baseline.
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Format
        # cargo fmt resolves no dependencies, so --locked is not applicable here.
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests (includes the agent contract suite)
        run: cargo test --all-targets --locked
      - name: Test inventory matches the documented count
        run: python .github/scripts/check_test_count.py
      - name: Contract docs, required files and fixture tree
        # Standalone Python scripts (no rg, no `python -c`) behave identically
        # under bash and pwsh; a missing file is a hard failure, not a no-op.
        run: python .github/scripts/check_contract_docs.py
      - name: Release version matches tag, manifests and docs
        run: python .github/scripts/check_release_version.py
      - name: Fuzz manifest resolves under --locked
        run: python .github/scripts/check_fuzz_manifest.py
      - name: Release build
        run: cargo build --release --locked
      - name: Sample smoke
        run: python sample/smoke.py
      - name: Sample cases checklist is up to date
        run: python sample/export_cases.py --check
