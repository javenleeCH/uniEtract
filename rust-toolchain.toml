[toolchain]
# MSRV and CI baseline. Keep in sync with .github/workflows/ci.yml (1.88.0)
# and `rust-version` in Cargo.toml. Pinning here makes local `cargo fmt`,
# `cargo clippy -D warnings` and `cargo test` reproduce the CI verdict instead
# of drifting with the machine's default toolchain.
channel = "1.88.0"
components = ["rustfmt", "clippy"]