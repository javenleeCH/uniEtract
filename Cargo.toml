[package]
name = "uniextract"
version = "0.2.0"
edition = "2024"
description = "Composable JSON, XPath and regex extraction CLI"
license = "MIT"

[[bin]]
name = "ux"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
encoding_rs = "0.8"
glob = "0.3"
jaq-core = "3.1.2"
jaq-json = { version = "2.0.3", features = ["serde"] }
jaq-std = "3.0.4"
nucleo-matcher = "0.3"
pest = "2"
pest_derive = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
serde_yaml_ng = "0.10"
sxd-document = "0.3"
sxd_html = "0.1.3"
sxd-xpath = "0.4"
thiserror = "2"
toml = "0.9"
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
